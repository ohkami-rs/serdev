[workspace]
resolver = "3"
members  = ["."]
exclude  = ["reexport"]

[package]
name    = "examples"
version = "0.0.0"
edition = "2024"

[dev-dependencies]
serdev     = { path = "../serdev", features = ["derive"] }
serde_json = { version = "1.0" }
validator  = { version = "0.20", features = ["derive"] }