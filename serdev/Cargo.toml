[package]
name          = "serdev"
description   = "SerdeV - Serde with Validation"
documentation = "https://docs.rs/serdev"
version       = { workspace = true }
edition       = { workspace = true }
authors       = { workspace = true }
homepage      = { workspace = true }
repository    = { workspace = true }
readme        = { workspace = true }
keywords      = { workspace = true }
categories    = { workspace = true }
license       = { workspace = true }

[dependencies]
serdev_derive = { version = "=0.3.0", path = "../serdev_derive" }
serde         = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0" # for README doc test
validator  = { version = "0.20", features = ["derive"] } # for README doc test
rand       = "0.9" # for bench
